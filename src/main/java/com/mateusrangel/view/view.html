<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Search</title>
    <link rel="stylesheet" href="../services/styles/style.css">
</head>

<body>
<form class="search-bar" role="search">
    <input
            type="text"
            name="city"
            placeholder="Enter City Name..."
            aria-label="Nome da cidade"
            autocomplete="off">

    <div class="search-button">
        <button type="submit" aria-label="Buscar clima">🔍</button>
    </div>
</form>
</body>

</html>
